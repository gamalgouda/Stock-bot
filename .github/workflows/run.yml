name: Stock Bot

on:
  schedule:
    # قبل إغلاق السوق الأمريكي (10:30 PM مصر صيفاً)
    - cron: '30 19 * * 1-5'
    # بعد إغلاق السوق الأمريكي (1:00 AM مصر صيفاً)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install yfinance requests pandas numpy

      - name: Run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SHEET_CSV: ${{ secrets.SHEET_CSV }}
        run: python bot.py
