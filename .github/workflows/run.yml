name: Stock Bot

on:
  schedule:
    # 05:00 UTC = 8 AM Egypt (summer) / 7 AM Egypt (winter)
    # ~9 hours after US close — yfinance data guaranteed updated
    # 2-6 = Tue-Sat UTC  →  Mon-Fri US evening
    - cron: '0 5 * * 2-6'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SHEET_CSV: ${{ secrets.SHEET_CSV }}
        run: python bot.py
